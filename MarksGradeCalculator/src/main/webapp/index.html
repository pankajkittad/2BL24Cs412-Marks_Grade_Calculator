<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Marks Grade Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Marks Grade Calculator</h2>
        <form action="CalculateGrade" method="post">
            <div class="form-group">
                <label for="name">Student Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="mark1">Subject 1 Marks:</label>
                <input type="number" id="mark1" name="marks" min="0" max="100" required>
            </div>
            <div class="form-group">
                <label for="mark2">Subject 2 Marks:</label>
                <input type="number" id="mark2" name="marks" min="0" max="100" required>
            </div>
            <div class="form-group">
                <label for="mark3">Subject 3 Marks:</label>
                <input type="number" id="mark3" name="marks" min="0" max="100" required>
            </div>
            <div class="form-group">
                <label for="mark4">Subject 4 Marks:</label>
                <input type="number" id="mark4" name="marks" min="0" max="100" required>
            </div>
            <div class="form-group">
                <label for="mark5">Subject 5 Marks:</label>
                <input type="number" id="mark5" name="marks" min="0" max="100" required>
            </div>
            <input type="submit" value="Calculate Grade">
        </form>
    </div>
</body>
</html>
